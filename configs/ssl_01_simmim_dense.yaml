# SimMIM pretraining, dense encoder — pretraining paths 1 and 3
# (docs/SIMMIM_GUIDE.md section 4).
#
#   python train.py --config configs/ssl_01_simmim_dense.yaml --data-dir /data/pass_arrow
#
# Anything omitted comes from config.SSL_METHOD_DEFAULTS["simmim"] (base_lr
# 2e-4 per 512 scaled to the effective batch, warmup 10, wd 0.05, betas
# (0.9, 0.999), clip 5, 32-px patches, ratio 0.6, drop path 0). Flags still
# override this file: `--epochs 800`, `--mask-space pixel`.

task: "ssl"
dataset:
  name: "pass"
ssl:
  method: "simmim"
  epochs: 200
  mask_space: "token"
model:
  ablation:
    use_moe: false
