# MoE, no shared
# Ablation ladder row 3 (scratch) — docs/HPARAMS.md section 4.
#
#   python train.py --config configs/scratch_03_moe_no_shared.yaml
#
# Anything omitted comes from the "scratch" recipe. Flags still override this
# file: `--config configs/scratch_03_moe_no_shared.yaml --epochs 300`.

recipe: "scratch"
epochs: 90
model:
  moe:
    num_experts: 4
    shared_expert: false
  ablation:
    use_moe: true
    moe_placement: [[], [], [], [-1]]
