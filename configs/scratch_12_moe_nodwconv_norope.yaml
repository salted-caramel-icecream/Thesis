# MoE block drops its DWConv, no RoPE
# Position-encoding arm — docs/HPARAMS.md section 2.
#
#   python train.py --config configs/scratch_12_moe_nodwconv_norope.yaml
#
# NOTE: Neither positional mechanism in the MoE'd block. Position survives only via the patch-embed convs (zero padding leaks absolute position), so this is a 'how much does the CFFN contribute' arm, not a degenerate run.
#
# moe_block_dwconv is SCOPED to the blocks in moe_placement; dense blocks
# elsewhere keep their official CFFN. Use model.dense_dwconv to strip those.

recipe: "scratch"
epochs: 90
model:
  moe:
    num_experts: 4
    shared_expert: true
    moe_block_dwconv: false
  ablation:
    use_moe: true
    moe_placement: [[], [], [], [-1]]
    use_rope: false
    rope_placement: [[], [], [], []]
