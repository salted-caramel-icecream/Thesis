# MoE upcycled, no shared
# Ablation ladder row 3 (pretrained) — docs/HPARAMS.md section 4.
#
#   python train.py --config configs/ft_03_moe_no_shared.yaml
#
# Anything omitted comes from the "pretrained" recipe. Flags still override this
# file: `--config configs/ft_03_moe_no_shared.yaml --epochs 300`.

recipe: "pretrained"
epochs: 100
model:
  moe:
    num_experts: 4
    shared_expert: false
  seed_moe_from_dense: true
  ablation:
    use_moe: true
    moe_placement: [[], [], [], [-1]]
