# SimMIM pretraining, dense encoder, mask applied in PIXEL space as well —
# the control for PVT v2's overlapping-stem leak (docs/SIMMIM_GUIDE.md
# section 3): the masked pixels are zeroed before the 7x7/stride-4 embed, so
# no visible token sees the 3-px band of a masked patch. Everything else is
# identical to ssl_01; the run name carries "-px".
#
#   python train.py --config configs/ssl_03_simmim_dense_pixel.yaml --data-dir /data/pass_arrow

task: "ssl"
dataset:
  name: "pass"
ssl:
  method: "simmim"
  epochs: 200
  mask_space: "pixel"
model:
  ablation:
    use_moe: false
