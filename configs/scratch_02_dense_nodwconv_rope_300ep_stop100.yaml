# Dense, no DWConv + RoPE — 300-epoch schedule, stopped at 100
# Base arm (scratch ladder row 2) on the long schedule — docs/HPARAMS.md section 4.
#
#   python train.py --config configs/scratch_02_dense_nodwconv_rope_300ep_stop100.yaml
#
# Same architecture as scratch_02_dense_nodwconv_rope.yaml; only the budget
# differs. `epochs` is the SCHEDULE (the cosine is built for 300) and
# `stop_at_epoch` is where this session gets off. Resume with the SAME
# `epochs: 300` and --resume-from .../milestone-epoch100.ckpt.
#
# NOTE: the DWConv is removed from EVERY block, so RoPE is placed in every
# NOTE: block too — the architecture edit as a whole. Pass --rope-placement
# NOTE: for a narrower arm.
#
# NOTE: drop_path is 0.1 here, the same as the 90-epoch row: it comes from
# NOTE: the VARIANT's official rate (variant_drop_path), not the epoch budget.
# NOTE: The budget is the only thing that differs from the 90-epoch arm, so
# NOTE: the two are directly comparable. docs/HPARAMS.md section 1 records
# NOTE: why the old epoch-based rule (0.15 at 300 ep) was replaced.

recipe: "scratch"
epochs: 300
stop_at_epoch: 100
milestones: [100, 150, 200, 300]
model:
  dense_dwconv: false
  ablation:
    use_moe: false
    use_rope: true
    rope_last_n_stages: 4
