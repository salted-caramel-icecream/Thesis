# N=8, stages 3 & 4 — 300-epoch schedule, stopped at 100
# Same arm as scratch_09_moe_e8_s3s4.yaml; only the budget differs.
#
#   python train.py --config configs/scratch_09_moe_e8_s3s4_300ep_stop100.yaml
#
# `epochs` is the SCHEDULE (the cosine is built for 300) and `stop_at_epoch`
# is where this session gets off, so the LR trajectory is identical to one
# uninterrupted 300-epoch run. Resume with the SAME `epochs: 300` and
# --resume-from .../milestone-epoch100.ckpt; dropping the budget to 100 on the
# resume would build a different, compressed schedule.
#
# NOTE: drop_path is 0.1 here, the same as the 90-epoch row: it comes from
# NOTE: the VARIANT's official rate (variant_drop_path), not the epoch budget.
# NOTE: The budget is the only thing that differs from the 90-epoch arm, so
# NOTE: the two are directly comparable. docs/HPARAMS.md section 1 records
# NOTE: why the old epoch-based rule (0.15 at 300 ep) was replaced.
#
# Milestones past 100 never fire in this session; they are pre-set so a
# resume needs no edit.

recipe: "scratch"
epochs: 300
stop_at_epoch: 100
milestones: [100, 150, 200, 300]
model:
  moe: {num_experts: 8, shared_expert: true}
  ablation:
    use_moe: true
    moe_placement:
    - []
    - []
    - [-1]
    - [-1]
    rope_placement:
    - []
    - []
    - [-1]
    - [-1]
