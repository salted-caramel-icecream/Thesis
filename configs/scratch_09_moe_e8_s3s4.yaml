# N=8, stages 3 & 4
# Ablation ladder row 9 (scratch) — docs/HPARAMS.md section 4.
#
#   python train.py --config configs/scratch_09_moe_e8_s3s4.yaml
#
# Anything omitted comes from the "scratch" recipe. Flags still override this
# file: `--config configs/scratch_09_moe_e8_s3s4.yaml --epochs 300`.
#
# NOTE: RoPE moved to stages 3+4 to match the MoE placement (this repo places
# NOTE: RoPE where MoE is). Pass --rope-placement to decouple the two axes.

recipe: "scratch"
epochs: 90
model:
  moe:
    num_experts: 8
    shared_expert: true
  ablation:
    use_moe: true
    moe_placement: [[], [], [1], [1]]
    rope_placement: [[], [], [1], [1]]
