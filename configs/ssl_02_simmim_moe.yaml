# SimMIM pretraining WITH the routed layer — pretraining path 2: the MoE'd
# block and its router train under the reconstruction + load-balancing loss,
# and the intermediate fine-tune loads the experts as trained
# (docs/SIMMIM_GUIDE.md section 4; the aux loss counts the masked positions).
#
#   python train.py --config configs/ssl_02_simmim_moe.yaml --data-dir /data/pass_arrow

task: "ssl"
dataset:
  name: "pass"
ssl:
  method: "simmim"
  epochs: 200
  mask_space: "token"
model:
  moe:
    num_experts: 4
    shared_expert: true
  ablation:
    use_moe: true
    moe_placement: [[], [], [], [-1]]
