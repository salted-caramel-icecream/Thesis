# Random-init experts (control)
# Ablation ladder row 6 (pretrained) — docs/HPARAMS.md section 4.
#
#   python train.py --config configs/ft_06_random_expert_init.yaml
#
# Anything omitted comes from the "pretrained" recipe. Flags still override this
# file: `--config configs/ft_06_random_expert_init.yaml --epochs 300`.
#
# NOTE: seed_moe_from_dense=False — this row IS the upcycling claim (replicated
# NOTE: vs random expert init).

recipe: "pretrained"
epochs: 100
model:
  moe:
    num_experts: 4
    shared_expert: true
  seed_moe_from_dense: false
  ablation:
    use_moe: true
    moe_placement: [[], [], [], [1]]
